name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      # Phase 0 门禁：ruff 基础规则（E/F/W/I 等，见 pyproject）全量扫描并阻断
      - name: Lint check
        run: ruff check . --ignore E501
      # mypy 全量上报，但不阻断（Phase 2 起改为阻断）；不再用 || true 隐藏结果
      - name: Type check (report, non-blocking)
        run: mypy modules --ignore-missing-imports
        continue-on-error: true
      # 跑全量默认测试套件（legacy 由 conftest 自动跳过），覆盖率地板 40% 阻断
      - name: Run full default test suite
        run: pytest tests/ -o addopts="" --cov=modules --cov-report=xml --cov-fail-under=40
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
