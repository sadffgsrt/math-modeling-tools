name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Lint check
        run: ruff check . --ignore E501
      - name: Type check
        run: mypy modules --ignore-missing-imports || true
      - name: Run tests
        run: pytest tests/test_workflow.py tests/test_model_solving.py tests/test_validation.py --cov=modules --cov-report=xml --cov-fail-under=0
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml