# LLM 配置模板（入库；真实 key 请放 llm_config.local.yaml 或 .env，切勿提交真实 key）
# 支持任何 OpenAI 兼容端点：OpenAI 官方 / DeepSeek / Moonshot / 本地 vLLM / Ollama 等

# 模型名
#   OpenAI: gpt-4o-mini / gpt-4o / gpt-4.1
#   DeepSeek: deepseek-chat / deepseek-reasoner
#   Moonshot: moonshot-v1-8k / moonshot-v1-32k
#   本地 Ollama: qwen2.5:7b（base_url 填 http://localhost:11434/v1）
model: gpt-4o-mini

# API base_url（留空用 openai 官方；兼容端点填对应地址）
#   OpenAI: 留空
#   DeepSeek: https://api.deepseek.com/v1
#   Moonshot: https://api.moonshot.cn/v1
#   本地: http://localhost:11434/v1
base_url: ""

# API key（留空，从 .env / 环境变量读；切勿在此填真实 key 并提交）
api_key: ""

# 生成参数
temperature: 0.2
max_tokens: 2000
